name: Flutter Android Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download Pretendard fonts
        run: bash tool/fetch_pretendard_fonts.sh

      - name: Generate Android project
        run: flutter create . --project-name jlptmaster --org com.jlptmaster --platforms=android

      - name: Apply JLPTmaster app name, permissions and TTS discovery
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()

          text = re.sub(r'android:label="[^"]*"', 'android:label="JLPTmaster"', text, count=1)

          internet = '<uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.INTERNET' not in text:
              text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + internet)

          tts_query = '''        <intent>
              <action android:name="android.intent.action.TTS_SERVICE"/>
          </intent>
          '''
          if 'android.intent.action.TTS_SERVICE' not in text:
              if '</queries>' in text:
                  text = text.replace('</queries>', tts_query + '</queries>')
              else:
                  text = text.replace('</manifest>', '    <queries>\n' + tts_query + '    </queries>\n</manifest>')

          path.write_text(text)
          PY
          grep -n 'android:label\|android.permission.INTERNET\|android.intent.action.TTS_SERVICE' android/app/src/main/AndroidManifest.xml

      - name: Apply high-resolution raster launcher icon
        run: |
          cat \
            assets/branding/app_icon.part-00 \
            assets/branding/app_icon.part-01 \
            assets/branding/app_icon.part-02 \
            | base64 --decode > /tmp/jlptmaster_app_icon.jpg
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('/tmp/jlptmaster_app_icon.jpg')
          image = Image.open(source).convert('RGB')
          print(f'launcher source: {image.width}x{image.height}')

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          root = Path('android/app/src/main/res')
          for folder, size in sizes.items():
              destination = root / folder / 'ic_launcher.png'
              destination.parent.mkdir(parents=True, exist_ok=True)
              resized = image.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(destination, 'PNG', optimize=True)
              print(f'{destination}: {size}x{size}')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://jlptmaster.duckdns.org

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jlptmaster-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
