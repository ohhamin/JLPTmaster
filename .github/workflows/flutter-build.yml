name: Flutter Android Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create . --project-name jlptmaster --org com.jlptmaster --platforms=android

      - name: Ensure Android permissions and TTS discovery
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()

          internet = '<uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.INTERNET' not in text:
              text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + internet)

          tts_query = '''        <intent>
              <action android:name="android.intent.action.TTS_SERVICE"/>
          </intent>
          '''
          if 'android.intent.action.TTS_SERVICE' not in text:
              if '</queries>' in text:
                  text = text.replace('</queries>', tts_query + '</queries>')
              else:
                  text = text.replace('</manifest>', '    <queries>\n' + tts_query + '    </queries>\n</manifest>')

          path.write_text(text)
          PY
          grep -n 'android.permission.INTERNET\|android.intent.action.TTS_SERVICE' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://jlptmaster.duckdns.org

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jlptmaster-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
